<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Friday - Your Virtual Assistant</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="container">
    <div class="card glass">
      <img src="7V3E.gif" class="avatar" alt="assistant" />
      <h1 class="Sonalika-name">Hello,Sonalika 👋</h1>
      <div class="chat-output">
        <div class="message assistant" id="content">Initializing...</div>
      </div>
      <button class="talk"><i class="fas fa-microphone-alt"></i></button>
      <p class="tip">Click the mic & start speaking</p>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
